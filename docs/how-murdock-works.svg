<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 640" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>How Murdock works</title>
  <desc>A voice satellite streams audio to Murdock, which forwards it live to the STT engine while verifying the speaker in parallel: liveness check, speaker extraction, CAM++ embedding, profile match. A gate then passes the transcript for known speakers or blocks it for unknown voices, whose audio lands in the training postbox. Home Assistant pushes context back over MQTT.</desc>
  <defs>
    <marker id="mR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#71717a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>

  <rect x="0" y="0" width="680" height="640" rx="20" fill="#0c0f14"/>

  <circle cx="56" cy="58" r="26" fill="#dc2626" opacity="0.10"/>
  <circle cx="56" cy="58" r="20.5" fill="none" stroke="#dc2626" stroke-width="4"/>
  <path d="M41.3 43.9 Q30.4 35.6 40.6 29.2 Q40 37.5 50.9 38.2 Z" fill="#dc2626"/>
  <path d="M70.7 43.9 Q81.6 35.6 71.4 29.2 Q72 37.5 61.1 38.2 Z" fill="#dc2626"/>
  <rect x="42.7" y="53.9" width="3.5" height="8.3" rx="1.7" fill="#991b1b"/>
  <rect x="48.4" y="50.7" width="3.5" height="14.7" rx="1.7" fill="#dc2626"/>
  <rect x="54.2" y="47.5" width="3.5" height="21.1" rx="1.7" fill="#ef4444"/>
  <rect x="60" y="50.7" width="3.5" height="14.7" rx="1.7" fill="#dc2626"/>
  <rect x="65.8" y="53.9" width="3.5" height="8.3" rx="1.7" fill="#991b1b"/>
  <text x="92" y="64" font-size="19" font-weight="600" letter-spacing="2" fill="#dc2626">MURDOCK — how it works</text>
  <text x="92" y="84" font-size="11.5" fill="#71717a">a speaker gate between your voice satellites and your STT engine</text>

  <rect x="40" y="104" width="156" height="58" rx="10" fill="#14181f" stroke="#27272a"/>
  <text x="118" y="128" font-size="14" font-weight="500" fill="#d4d4d8" text-anchor="middle">Voice satellite</text>
  <text x="118" y="146" font-size="11" fill="#71717a" text-anchor="middle">wake word → audio</text>

  <rect x="262" y="104" width="156" height="58" rx="10" fill="#1a1f28" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="128" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">Murdock proxy</text>
  <text x="340" y="146" font-size="11" fill="#71717a" text-anchor="middle">the speaker gate</text>

  <rect x="484" y="104" width="156" height="58" rx="10" fill="#14181f" stroke="#27272a"/>
  <text x="562" y="128" font-size="14" font-weight="500" fill="#d4d4d8" text-anchor="middle">STT engine</text>
  <text x="562" y="146" font-size="11" fill="#71717a" text-anchor="middle">whisper / voxtral</text>

  <line x1="198" y1="133" x2="256" y2="133" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mR)"/>
  <text x="227" y="152" font-size="11" fill="#71717a" text-anchor="middle">audio</text>
  <line x1="420" y1="133" x2="478" y2="133" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mR)"/>
  <text x="449" y="152" font-size="11" fill="#71717a" text-anchor="middle">live</text>

  <polyline points="562,162 562,180 652,180 652,404 420,404" fill="none" stroke="#71717a" stroke-width="1.4" marker-end="url(#mM)"/>
  <text x="600" y="174" font-size="11" fill="#71717a" text-anchor="middle">transcript</text>

  <line x1="340" y1="162" x2="340" y2="196" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mR)"/>

  <rect x="36" y="200" width="608" height="148" rx="12" fill="none" stroke="#3f3f46" stroke-dasharray="5 4"/>
  <text x="52" y="224" font-size="11" fill="#71717a">while the STT transcribes, Murdock verifies — in parallel, ~zero added latency</text>

  <rect x="46" y="240" width="132" height="78" rx="9" fill="#14181f" stroke="#27272a"/>
  <text x="112" y="266" font-size="13.5" font-weight="500" fill="#d4d4d8" text-anchor="middle">Liveness</text>
  <text x="112" y="287" font-size="11" fill="#71717a" text-anchor="middle">rejects playback</text>
  <text x="112" y="302" font-size="11" fill="#71717a" text-anchor="middle">and TV audio</text>

  <rect x="198" y="240" width="132" height="78" rx="9" fill="#14181f" stroke="#27272a"/>
  <text x="264" y="266" font-size="13.5" font-weight="500" fill="#d4d4d8" text-anchor="middle">Extraction</text>
  <text x="264" y="287" font-size="11" fill="#71717a" text-anchor="middle">isolates the</text>
  <text x="264" y="302" font-size="11" fill="#71717a" text-anchor="middle">target voice</text>

  <rect x="350" y="240" width="132" height="78" rx="9" fill="#14181f" stroke="#27272a"/>
  <text x="416" y="266" font-size="13.5" font-weight="500" fill="#d4d4d8" text-anchor="middle">CAM++ embed</text>
  <text x="416" y="287" font-size="11" fill="#71717a" text-anchor="middle">192-dim</text>
  <text x="416" y="302" font-size="11" fill="#71717a" text-anchor="middle">voiceprint</text>

  <rect x="502" y="240" width="132" height="78" rx="9" fill="#14181f" stroke="#27272a"/>
  <text x="568" y="266" font-size="13.5" font-weight="500" fill="#d4d4d8" text-anchor="middle">Match</text>
  <text x="568" y="287" font-size="11" fill="#71717a" text-anchor="middle">vs enrolled</text>
  <text x="568" y="302" font-size="11" fill="#71717a" text-anchor="middle">profiles ± context</text>

  <line x1="181" y1="279" x2="194" y2="279" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mR)"/>
  <line x1="333" y1="279" x2="346" y2="279" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mR)"/>
  <line x1="485" y1="279" x2="498" y2="279" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mR)"/>

  <line x1="340" y1="348" x2="340" y2="378" stroke="#dc2626" stroke-width="1.6" marker-end="url(#mR)"/>

  <rect x="270" y="382" width="140" height="44" rx="10" fill="#1a1f28" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="409" font-size="13.5" font-weight="600" fill="#d4d4d8" text-anchor="middle">known speaker?</text>

  <line x1="298" y1="426" x2="190" y2="464" stroke="#ef4444" stroke-width="1.6" marker-end="url(#mX)"/>
  <line x1="382" y1="426" x2="490" y2="464" stroke="#34d399" stroke-width="1.6" marker-end="url(#mG)"/>

  <rect x="46" y="470" width="264" height="68" rx="10" fill="#14181f" stroke="#7f1d1d"/>
  <text x="178" y="493" font-size="13.5" font-weight="600" fill="#ef4444" text-anchor="middle">✗ unknown — blocked</text>
  <text x="178" y="511" font-size="11" fill="#71717a" text-anchor="middle">empty transcript; the audio lands in the</text>
  <text x="178" y="526" font-size="11" fill="#71717a" text-anchor="middle">unknown postbox for one-click training</text>

  <rect x="370" y="470" width="264" height="68" rx="10" fill="#14181f" stroke="#14532d"/>
  <text x="502" y="493" font-size="13.5" font-weight="600" fill="#34d399" text-anchor="middle">✓ known — command passes</text>
  <text x="502" y="511" font-size="11" fill="#71717a" text-anchor="middle">transcript + speaker → Home Assistant,</text>
  <text x="502" y="526" font-size="11" fill="#71717a" text-anchor="middle">sensor.murdock_* update instantly</text>

  <line x1="46" y1="581" x2="72" y2="581" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="82" y="585" font-size="11" fill="#71717a">HA pushes context back over MQTT — which satellite is listening, what&#8217;s playing.</text>
  <text x="82" y="601" font-size="11" fill="#71717a">While media plays in that room, the gate tightens automatically.</text>
</svg>
