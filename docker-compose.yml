services:
  murdock:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    container_name: murdock
    ports:
      - "10350:10350"   # Wyoming proxy
      - "8099:8099"     # Web UI
    volumes:
      - ./data:/app/data
      # Persist ONNX models across rebuilds and let you pre-populate
      # them from the host if Hugging Face is rate-limiting. If this
      # directory is empty on first start the container will try to
      # download the models itself.
      - ./models:/app/models
    environment:
      - LISTEN_URI=tcp://0.0.0.0:10350
      # STT backend: "upstream" (Wyoming proxy) or "voxtral" (Mistral Cloud)
      - STT_BACKEND=${STT_BACKEND:-upstream}
      # IMPORTANT: UPSTREAM_URI must point to a host Murdock can actually
      # reach from inside its container (only needed for STT_BACKEND=upstream):
      #   * tcp://host.docker.internal:10300  (STT runs on the host)
      #   * tcp://<container_name>:10300      (STT runs in the same Docker network)
      #   * tcp://<lan_ip>:10300              (STT runs on another machine)
      - UPSTREAM_URI=${UPSTREAM_URI:-tcp://host.docker.internal:10300}
      # Voxtral settings (only needed for STT_BACKEND=voxtral):
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-voxtral-mini-latest}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8099
      - LOG_LEVEL=info
      # MQTT (recommended HA integration). Uncomment + set your broker to
      # get auto-discovery in HA without a token. These seed the DB on
      # first start; thereafter the Web UI (Settings → MQTT) is the
      # source of truth.
      # - MQTT_ENABLED=true
      # - MQTT_HOST=192.168.1.100        # or core-mosquitto on HAOS
      # - MQTT_PORT=1883
      # - MQTT_USERNAME=
      # - MQTT_PASSWORD=
      # All other settings (threshold, HA integration, languages, …)
      # are configured via the web UI at http://localhost:8099 and
      # persisted in the database. No .env file needed.
    extra_hosts:
      # Lets `host.docker.internal` resolve on Linux hosts too (Docker
      # Desktop on Windows/macOS adds this automatically).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # If your faster-whisper container is on a specific Docker network,
    # uncomment the block below and set the network name to match:
    # networks:
    #   - wyoming

# networks:
#   wyoming:
#     external: true
#     name: <name_of_the_network_faster-whisper_is_on>
