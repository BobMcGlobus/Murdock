services:
  voiceid:
    build: .
    container_name: voiceid
    ports:
      - "10350:10350"   # Wyoming proxy
      - "8099:8099"     # Web UI
    volumes:
      - ./data:/app/data
      # Persist ONNX models across rebuilds and let you pre-populate
      # them from the host if Hugging Face is rate-limiting. If this
      # directory is empty on first start the container will try to
      # download the models itself.
      - ./models:/app/models
    environment:
      - LISTEN_URI=tcp://0.0.0.0:10350
      # IMPORTANT: UPSTREAM_URI must point to a host VoiceID can actually
      # reach from inside its container. Common options:
      #   * tcp://host.docker.internal:10300  (STT runs on the host)
      #   * tcp://<container_name>:10300      (STT runs in the same Docker network — see networks: below)
      #   * tcp://<lan_ip>:10300              (STT runs on another machine)
      - UPSTREAM_URI=${UPSTREAM_URI:-tcp://host.docker.internal:10300}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8099
      - LOG_LEVEL=info
      # All other settings (threshold, HA integration, languages, …)
      # are configured via the web UI at http://localhost:8099 and
      # persisted in the database. No .env file needed.
    extra_hosts:
      # Lets `host.docker.internal` resolve on Linux hosts too (Docker
      # Desktop on Windows/macOS adds this automatically).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # If your faster-whisper container is on a specific Docker network,
    # uncomment the block below and set the network name to match:
    # networks:
    #   - wyoming

# networks:
#   wyoming:
#     external: true
#     name: <name_of_the_network_faster-whisper_is_on>
